<!doctype html>
<html><head><meta charset="utf-8"><title>Build Checklist</title>
<!-- The loading window shown while the app starts (main.js createWindow). main.js calls step(text, fraction) as the page loads and
     closes this window when the menu is ready. A loading.gif / .webm / .mp4 / .png / .webp / .apng / .svg in the Data folder
     replaces the wrench (main.js passes it as ?c=<file URL>&v=1 for a video). -->
<style>
@font-face{font-family:'Inter';src:url(lib/fonts/Inter.woff2) format('woff2');font-weight:100 900}
:root{--bg:#14171a;--fg:#e9e7e2;--mut:#9a9ea5;--line:#30363c;--acc:#ff8a4c}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,"Segoe UI",system-ui,sans-serif;user-select:none;cursor:default}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 16px;-webkit-app-region:drag}
#art{width:220px;height:220px;display:flex;align-items:center;justify-content:center}
#art svg,#art img,#art video{max-width:100%;max-height:100%;display:block}
#w{transform-origin:0 0;animation:spin 1.6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.still #w{animation:none;transform:rotate(-40deg)}
.name{font-size:20px;font-weight:600}
.bar{width:320px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:5%;background:var(--acc);border-radius:3px;transition:width .3s ease}
.st{font-size:13px;color:var(--mut);min-height:1.2em}
</style></head><body>
<div class="wrap">
 <div id="art"><svg viewBox="-130 -130 260 260" width="220" height="220" aria-label="Loading">
  <defs>
   <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e6e9"/><stop offset=".5" stop-color="#aab0b7"/><stop offset="1" stop-color="#7a8189"/></linearGradient>
   <mask id="cut"><rect x="-130" y="-130" width="260" height="260" fill="#fff"/>
    <g transform="translate(-96 0) rotate(-15)"><rect x="-60" y="-11.5" width="62" height="23" fill="#000"/><circle r="11.5" fill="#000"/></g>
    <path id="box" fill="#000"/>
   </mask>
  </defs>
  <g id="w"><g mask="url(#cut)" fill="url(#steel)" stroke="#5c636b" stroke-width="1.5"><path d="M-96 -9 L96 -7 L96 7 L-96 9 Z"/><circle cx="-96" r="27"/><circle cx="96" r="24"/></g>
   <path d="M-60 -3 L60 -2.5 L60 2.5 L-60 3 Z" fill="#8a9098" opacity=".55"/></g>
 </svg></div>
 <div class="name">Build Checklist</div>
 <div class="bar"><i id="fill"></i></div>
 <div class="st" id="st">Starting…</div>
</div>
<script>
let d='';for(let i=0;i<24;i++){const a=i*Math.PI/12,r=i%2?13.5:15.5;d+=(i?'L':'M')+(96+r*Math.cos(a)).toFixed(2)+','+(r*Math.sin(a)).toFixed(2)}
document.getElementById('box').setAttribute('d',d+'Z');
const q=new URLSearchParams(location.search),c=q.get('c');
if(q.has('still'))document.body.classList.add('still');
// the shop's own animation instead of the wrench; if it cannot be shown, the wrench stays
if(c){const el=document.createElement(q.get('v')?'video':'img');el.src=c;if(el.tagName==='VIDEO'){el.muted=true;el.loop=true;el.autoplay=true;el.playsInline=true}
 el.onerror=()=>el.remove();el[el.tagName==='VIDEO'?'onloadeddata':'onload']=()=>{const a=document.getElementById('art');a.innerHTML='';a.appendChild(el)};
 el.style.display='block';if(el.tagName==='VIDEO')el.load()}
function step(t,p){if(t)document.getElementById('st').textContent=t;if(p!=null)document.getElementById('fill').style.width=Math.round(Math.max(5,Math.min(1,p)*100))+'%'}
</script></body></html>
