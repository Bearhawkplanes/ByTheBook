<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Checklist</title>

<style>
:root{color-scheme:dark;--bg:#14171a;--panel:#1c2024;--fg:#e9e7e2;--mut:#9a9ea5;--line:#30363c;--acc:#ff8a4c;--ok:#6fcf74;--warn:#ff7b72;--hbg:#0e1114;--hfg:#eceae5}
:root[data-theme="light"]{color-scheme:light;--bg:#ece8e0;--panel:#fbfaf7;--fg:#1d2024;--mut:#6a6e75;--line:#dad5ca;--acc:#d9480f;--ok:#2b7a3d;--warn:#b3261e;--hbg:#1f2d3a;--hfg:#f3f1ec}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column}
input,textarea,select,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
button{cursor:pointer;transition:border-color .12s,background .12s}button:hover{border-color:var(--acc)}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--acc) 45%,transparent);border-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px;padding:0}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--hbg);color:var(--hfg)}
header input,header select,header button{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);color:var(--hfg)}
header button:hover{background:rgba(255,255,255,.14)}header option{color:#111}
header label{display:flex;gap:6px;align-items:center;margin:0;color:#b9bec5;font-size:12px}
#prog{font:500 12px 'IBM Plex Mono',monospace;color:#f0b48f}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 8px minmax(0,1fr)}
#L{overflow:auto;padding:0 18px 16px;min-width:0}#R{overflow:auto;padding:0 16px 16px;min-width:0;background:var(--panel);border-left:1px solid var(--line)}
@media(max-width:900px){#split{display:none}main{grid-template-columns:1fr;display:block;overflow:auto}#L,#R{overflow:visible}#R{border-left:0;border-top:1px solid var(--line)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.card.task{border-left:4px solid var(--line)}.card.task.signed{border-left-color:var(--ok)}
h2{font-size:13px;font-weight:600;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:7px;align-items:center;padding:6px;border-radius:8px;border-top:1px solid var(--line)}
.row .t{flex:1;min-width:70px;border-color:transparent;background:transparent}
.row .t:focus{background:var(--bg)}
.row .sig{width:130px;font-size:12px}.row .init{width:54px;font-size:12px;text-align:center;font-family:'IBM Plex Mono',monospace;padding:3px 4px}.row .sig.need{border-color:var(--warn)}
.row.sel{background:color-mix(in srgb,var(--acc) 10%,transparent);box-shadow:inset 3px 0 0 var(--acc)}
.row.done .t{text-decoration:line-through;color:var(--mut)}
.row button:not(.chip){padding:1px 6px;font-size:12px;opacity:.5}.row:hover button:not(.chip){opacity:1}
.chip{font:500 11px 'IBM Plex Mono',monospace;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--mut);white-space:nowrap;background:none}
.chip.pg{color:var(--acc);border-color:var(--acc)}.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.warn{color:var(--warn);border-color:var(--warn)}
.steps{margin:4px 0 4px 12px;padding-left:8px;border-left:2px solid var(--line);counter-reset:s}
.steps .row{counter-increment:s}.steps .row::before{content:counter(s);font:500 11px 'IBM Plex Mono',monospace;color:var(--mut);width:16px;text-align:right}
.bar{height:5px;width:60px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.tabs{display:flex;position:sticky;top:0;z-index:2;background:var(--panel);margin:0 -16px 14px;padding:0 16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:12px 16px;color:var(--mut);font-weight:500}
.tabs button.on{color:var(--fg);border-bottom-color:var(--acc)}
#sel{font-size:19px;font-weight:600;margin-bottom:10px;letter-spacing:-.01em}
.mut{color:var(--mut);font-size:12px}.warn{color:var(--warn)}
#R label{display:block;margin:10px 0 3px;font-size:12px;color:var(--mut)}
#R label input,#R label textarea,#R label select{width:100%}textarea{font-family:inherit;line-height:1.5}
[data-f=spec],[data-f=page],[data-f=qty],[data-f=size]{font-family:'IBM Plex Mono',monospace}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:10px}
.tile{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.tile img,.tile video{display:block;width:100%}.tile img{cursor:zoom-in}.tile a{display:block;padding:8px;word-break:break-all}
.tile button{position:absolute;top:6px;right:6px;padding:0 7px}
.tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
#vbox{overflow:auto;max-height:calc(100vh - 250px);min-height:300px;border:1px solid var(--line);border-radius:8px;background:#7d7d7d}
canvas{display:block;margin:0 auto}
@media(max-width:900px){#vbox{max-height:70vh}}
.secband{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;margin:28px 0 12px;padding:10px 0;border-top:2px solid var(--fg);border-bottom:1px solid var(--line)}
#L .secband:first-child{margin-top:0}
.secband h3{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.sectitle{display:flex;align-items:center;gap:8px}
.tedit{font:600 18px 'IBM Plex Sans',sans-serif;text-align:center;min-width:240px}
.pencil{background:var(--hbg);color:#fff;border-color:var(--hbg);border-radius:50%;width:24px;height:24px;padding:0;font-size:13px;line-height:1}
.pencil:hover{background:var(--acc);border-color:var(--acc)}
.secctl{position:absolute;right:0;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.secctl label{display:flex;gap:4px;align-items:center;margin:0}.secctl button{padding:1px 7px;font-size:12px}
.addsec{text-align:center;margin:28px 0 8px}
@media(max-width:700px){.secband{flex-wrap:wrap}.secctl{position:static}}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.hc{text-align:center}.tline{display:flex;align-items:center;justify-content:center;gap:10px}
#ptitle{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
#pti{font:600 22px 'IBM Plex Sans',sans-serif;text-align:center;min-width:300px}
#ptEdit{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35)}
.autol{margin-left:18px;white-space:nowrap}.autol select{max-width:175px;padding:3px 6px}@media(max-width:1100px){.autol span{display:none}}.hl{position:relative}.hr{display:flex;justify-content:flex-end}#menuBtn,#cog{font-size:18px;padding:3px 11px}
#menu{position:absolute;top:calc(100% + 8px);left:0;z-index:40;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
#menu button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:7px 10px;color:var(--fg)}
#menu button:hover:not(:disabled){background:color-mix(in srgb,var(--acc) 14%,transparent)}
#menu button:disabled{color:var(--mut);cursor:default}#menu i{font-size:11px}#menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}#menu .warnb{color:var(--warn)}
button:disabled{opacity:.3;cursor:not-allowed}
body.locked .ed{display:none!important}
.row span.t{flex:1;min-width:70px;padding:5px 9px;overflow-wrap:anywhere}
.secband.complete{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:var(--ok)}.secband.complete h3{color:var(--ok)}
.seg{display:inline-flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:7px 0 0 7px;margin:0}.seg button:last-child{border-radius:0 7px 7px 0}
.seg button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.fit{position:relative;height:calc(100vh - 290px);min-height:260px;background:var(--bg);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fit img,.fit video{max-width:100%;max-height:100%;object-fit:contain}
.nav{position:absolute;top:50%;transform:translateY(-50%);font-size:18px;padding:10px 12px;opacity:.85}.nav.l{left:8px}.nav.r{right:8px}.fit .x{position:absolute;top:8px;right:8px}
.stack .tile{margin-bottom:14px}.g3 .tile img,.g3 .tile video{aspect-ratio:4/3;object-fit:cover}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:center;justify-content:center}
.dlg{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(560px,92vw);max-height:86vh;overflow:auto}
.dlg label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}.dlg label.chk{display:flex;gap:8px;align-items:center;color:var(--fg);font-size:13px}
.dlg input:not([type=checkbox]):not([type=range]),.dlg select{width:100%}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:16px}.ds{border-top:1px solid var(--line);padding:12px 0}.dt{font-weight:600;margin-bottom:8px}
.dbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.pri{background:var(--acc);color:#fff;border-color:var(--acc)}.danger{background:var(--warn);color:#fff;border-color:var(--warn)}
.sw{width:28px;height:28px;border-radius:50%;background:var(--acc);flex:none}.lg{font:11px 'IBM Plex Mono',monospace;color:var(--mut);padding:2px 0}
.pin{letter-spacing:.35em;text-align:center;font:600 18px 'IBM Plex Mono',monospace}
.row .init[readonly]{background:transparent;cursor:default}
#lockBtn.open{border-color:var(--ok);color:var(--ok)}
.rcode{font:700 22px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-align:center;padding:14px;border:2px dashed var(--line);border-radius:10px;margin:10px 0;user-select:all}
@media print{body>*:not(.rcov){display:none!important}.rcov{position:static!important;background:#fff!important;color:#000!important}.rcov .dbtn,.rcov label.chk{display:none!important}.rcov .dlg{box-shadow:none!important;border:0!important;color:#000!important}}
.et table{width:100%;border-collapse:collapse;font-size:13px}.et td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}.et td:first-child{white-space:nowrap}
.lt{width:100%;border-collapse:collapse;font-size:12.5px}.lt td,.lt th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.lt th{position:sticky;top:0;background:var(--panel)}
.lseg td{font-weight:700;padding:10px 8px}.lseg.tamper td{background:#5b1d1d;color:#ffd9d6;border-top:3px solid #f85149}.lseg.recovery td{background:#4a3a12;color:#ffe9b0;border-top:3px solid #d29922}
.lt tr.tam td{background:rgba(248,81,73,.10)}.lt tr.tam td:first-child{border-left:4px solid #f85149}.lt tr.rec td:first-child{border-left:4px solid #d29922}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--hbg);color:var(--hfg);padding:8px 16px;border-radius:8px;z-index:70}
@media(max-width:700px){header{grid-template-columns:auto 1fr auto}#ptitle{font-size:18px}}
#R{border-left:0}#split{cursor:col-resize;background:var(--line);touch-action:none;transition:background .1s}#split:hover,#split.drag{background:var(--acc)}#split.snap{background:var(--ok)}
body.dragging{user-select:none;cursor:col-resize}
#home{position:fixed;inset:0;z-index:30;display:flex;background:var(--bg)}
.hh{font-weight:600;font-size:15px;margin-bottom:10px}
#hmain{flex:1;display:flex;justify-content:center;overflow:auto;padding:48px 24px}.hcenter{width:min(640px,100%);text-align:center}
.hcenter h1{font-size:34px;margin:0 0 24px;letter-spacing:-.02em}.hbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
.big{padding:14px 22px;font-size:16px;border-radius:10px}.big i{font-size:11px;opacity:.7;margin-left:6px}
.hcenter h2{font-size:15px;text-align:left;margin:0 0 8px}
.frow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left}
.frow:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}.frow.sel{background:var(--acc);color:#fff}.frow.sel .mut{color:rgba(255,255,255,.8)}
.fn{flex:1;overflow-wrap:anywhere}
.open{background:#2b7a3d;color:#fff;border-color:#2b7a3d;font-weight:700;padding:3px 14px}
#hdel{position:fixed;right:22px;bottom:18px;text-align:center;z-index:31}
#hdel .delbtn{background:var(--warn);color:#fff;border-color:var(--warn);font-weight:700;padding:8px 22px}#hdel small{display:block;color:var(--warn);font-size:11px;margin-top:3px}
#hleft{width:300px;max-width:40%;display:flex;flex-direction:column;border-right:1px solid var(--line)}
#hside{flex:1;border-bottom:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:18px 14px;overflow:auto}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:14px 0 16px;color:var(--fg);font-size:13px}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;color:var(--mut);transition:border-color .12s,color .12s}
.prof:hover .avatar,.prof.on .avatar{border-color:var(--acc);color:var(--acc)}
#hprof{text-align:left}#hprof h2{font-size:22px;margin:14px 0 6px}
#hprof label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}#hprof label.chk{display:flex;gap:8px;align-items:center;color:var(--fg);font-size:14px;margin:0}
#hprof input:not([type=checkbox]){width:100%;max-width:320px}
.pf{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;background:var(--panel)}
.pf ul{margin:6px 0 0 18px;padding:0;color:var(--mut);font-size:12px}.pf li{margin:2px 0}
.prow{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.prow input:not([type=checkbox]){width:auto}
.row .pen{padding:1px 6px}.row .pen.need{opacity:1;background:var(--acc);border-color:var(--acc);color:#fff}
.stabs{position:sticky;top:0;z-index:5;display:flex;gap:2px;align-items:flex-end;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;margin:0 -18px 14px;padding:10px 18px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.stab{flex:0 1 170px;min-width:88px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--panel);color:var(--mut);padding:7px 14px;margin-bottom:-1px}
.stab:hover{color:var(--fg);border-color:var(--line)}.stab.on{color:var(--fg);background:var(--bg);box-shadow:inset 0 2px 0 var(--acc);font-weight:600}
.stab.complete::before{content:"✓ ";color:var(--ok)}.stab.add{flex:0 0 auto;min-width:0;padding:7px 12px;font-weight:600}.stabs+.secband{margin-top:8px}
.row.hit{background:color-mix(in srgb,#ffd33d 20%,transparent);box-shadow:inset 3px 0 0 #ffd33d}
#ld{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center}.ldc{width:min(440px,80vw);text-align:center}
#ldt{color:#fff;margin-bottom:10px;overflow-wrap:anywhere}.ldb{height:10px;background:rgba(255,255,255,.14);border-radius:6px;overflow:hidden}.ldb i{display:block;height:100%;width:0;background:#3fb950;transition:width .12s}.ldh{margin-top:10px;color:#6d7279;font-size:12px}
#pv{position:fixed;inset:0;z-index:32;display:flex;flex-direction:column;background:var(--bg)}
#pvtop{display:flex;gap:14px;align-items:center;padding:10px 16px;background:var(--hbg);color:var(--hfg)}#pvtop button{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);color:var(--hfg)}
#pvbody{flex:1;min-height:0;display:flex}#pvside{width:300px;max-width:40%;border-right:1px solid var(--line);background:var(--panel);padding:14px;overflow:auto}
#pvmain{flex:1;min-width:0;padding:12px 16px;display:flex;flex-direction:column}#pvbox{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:8px;background:#7d7d7d}
#pvres .frow{padding:6px 8px;font-size:12px}#pvlist .frow button{padding:0 6px}#pvadd{margin-top:8px}
#menu button i{font-style:normal;color:var(--mut)}
</style></head><body>
<header>
<div class="hl" style="display:flex;gap:8px;align-items:center"><button id="menuBtn" title="Menu">☰</button><input id="lsearch" placeholder="Search checklist…" style="width:190px;min-width:0"><span id="lcount" class="mut"></span><label class="autol"><span>On click, show</span><select id="autos" title="What the right-hand panel shows when you click an item"><option value="stay">Stay on current tab</option><option value="auto">Auto (images, else PDF)</option><option value="img">Images</option><option value="desc">Description</option><option value="pdf">PDF</option></select></label><div id="menu" hidden>
<button data-m="mainmenu">Menu</button><button data-m="new">New checklist <i>Ctrl+N</i></button><button data-m="delete">Delete checklist</button>
<button data-m="loc">Open file location</button><button data-m="export">Export for sharing…</button>
<button data-m="save">Save <i>Ctrl+S</i></button><button data-m="saveas">Save as… <i>Ctrl+Shift+S</i></button><button data-m="dl">Save a copy elsewhere (.bcl)</button><button data-m="restore">Restore from backup…</button><button data-m="log">Activity log…</button><hr>
<button data-m="pdf">Open PDF…</button><button data-m="demo">Load demo</button><hr>
<button data-m="uncheck" class="warnb">Uncheck everything…</button></div></div>
<div class="hc"><div class="tline"><h1 id="ptitle"></h1><button class="pencil ed" id="ptEdit" title="Rename checklist">✎</button><span id="lockb" class="chip ok" hidden>🔒 master file</span></div><div id="prog"></div></div>
<div class="hr" style="gap:8px"><button id="lockBtn" hidden></button><button id="pdfBtn" title="PDF viewer">📄 PDFs</button><button id="cog" title="Settings">⚙</button></div>
<input id="file" type="file" accept="application/pdf" multiple hidden><input id="jfile" type="file" accept=".bcl,.json,application/json" hidden>
</header>
<main>
<section id="L"></section>

</div>
</section>

<div class="hbtns"><button class="big pri" id="hNew">Create new checklist</button><button class="big" id="hImp">Import</button></div>

<div id="hprof" class="hcenter" hidden></div>

function renderL(){

// ---------- file library / main menu ----------
function uniqueName(base,self){base=(base||'').trim().replace(/[\\/:*?"<>|]+/g,'_')||'unnamed';const used=new Set(LIB.filter(x=>x.id!==self).map(x=>x.name.toLowerCase()));let n=base,k=2;while(used.has(n.toLowerCase()))n=base+' '+k++;return n}
async function refreshLib(){let rec={};try{rec=JSON.parse(localStorage.getItem('ewf-recent'))||{}}catch(e){}const l=await FS.list();LIB=l.map(f=>({id:f.name,name:f.name,saved:f.mtime,opened:rec[f.name]||0}))}
function markOpened(id,to){let r={};try{r=JSON.parse(localStorage.getItem('ewf-recent'))||{}}catch(e){}if(to){r[to]=r[id]||0;delete r[id]}else r[id]=Date.now();try{localStorage.setItem('ewf-recent',JSON.stringify(r))}catch(e){}}
let FLP=Promise.resolve();   // saves run one at a time, in order
function flush(){return FLP=FLP.then(flushNow,flushNow)}
async function flushNow(){if(!CUR||!DIRTY)return true;DIRTY=false;clearTimeout(save.t);const id=CUR;
 try{await FS.write(id+'.bcl',await pack());const e=LIB.find(x=>x.id===id);if(e)e.saved=Date.now();return true}catch(x){DIRTY=true;toast('Could not save: '+((x&&x.message)||x));return false}}
async function addEntry(obj,name){const base=uniqueName(name);obj.name=obj.name||base;await FS.write(base+'.bcl',JSON.stringify(obj));LIB.push({id:base,name:base,saved:Date.now(),opened:0});return base}
async function syncName(){const nn=uniqueName(S.name,CUR);if(nn===CUR)return;DIRTY=true;await flush();
 try{await FS.rename(CUR+'.bcl',nn+'.bcl')}catch(e){toast(e.message||'Could not rename the file');return}
 markOpened(CUR,nn);const e=LIB.find(x=>x.id===CUR);if(e){e.id=nn;e.name=nn}CUR=nn;if(S.name!==nn){S.name=nn;renderTitle();save()}}
async function openProject(id){let r;
 try{r=await load('Opening '+id,async step=>{await step(.03,'Reading file…');const txt=await FS.read(id+'.bcl');await step(.4,'Reading checklist…');const raw=JSON.parse(txt);
  if(CUR&&DIRTY){await step(.6,'Saving the open checklist…');await flush()}await step(.8,'Preparing checklist…');const u=unpack(raw);await step(1);return u})}
 catch(e){toast('Could not read that file');return}
 if(!r||r==='cancelled')return;
 CUR=id;S=r.o;S.name=id;SEL=null;ER=ES=null;EDITOK=null;stampCheck();LQ='';$('#lsearch').value='';$('#lcount').textContent='';
 for(const k in urls){URL.revokeObjectURL(urls[k]);delete urls[k]}
 for(const m of [MEDIA,PDFS,PIDX])for(const k in m)delete m[k];IXB++;Object.assign(MEDIA,r.files);Object.assign(PDFS,r.P);
 noPdf();markOpened(id);const e=LIB.find(x=>x.id===id);if(e)e.opened=Date.now();
 renderPdfUI();setTab('desc');renderL();renderR();updLock();$('#home').hidden=true;pvClose();afterOpen()}
async function deleteProject(id){clearTimeout(save.t);if(CUR===id)DIRTY=false;try{await FS.remove(id+'.bcl')}catch(e){toast('Could not delete the file');return}
 LIB=LIB.filter(x=>x.id!==id);if(CUR===id){CUR=null;S=norm();SEL=null;pdf=null}if(HS===id)HS=null;renderHome()}
const askDelete=id=>{const e=LIB.find(x=>x.id===id);if(e)ask(`Delete "${esc(e.name)}"? This removes the checklist, its attached images and its PDF. This cannot be undone.`,'Delete',()=>deleteProject(id),1)};
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const d2b=d=>{const i=d.indexOf(','),bin=atob(d.slice(i+1)),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:d.slice(5,i).split(';')[0]||'application/octet-stream'})};
// builds the file text; the big base64 blobs are cached and spliced in, so JSON.stringify never re-scans them
async function pack(name,strip){if(PR.pid&&!errNow()&&!S.stamp)S.stamp={pid:PR.pid,rv:PR.rv};   // every saved checklist carries the profile ID
 const o=JSON.parse(JSON.stringify(S)),big={};o.files={};if(name!=null)o.name=name;if(strip)strip(o);
 for(const s of o.sections)for(const c of s.cards)for(const x of [c,...c.steps])for(const m of x.media)if(m.id&&!o.files[m.id]){const r=MEDIA[m.id];if(r){const k='m:'+m.id;big[k]=r.data||(r.data=await b2d(r.blob));o.files[m.id]={name:r.name,type:r.type,data:'@@'+k+'@@'}}}
 for(const p of o.pdfs){const r=PDFS[p.id];if(r){const k='p:'+p.id;big[k]=r.data||(r.data=await b2d(new Blob([r.buf],{type:'application/pdf'})));p.data='@@'+k+'@@'}}
 const t=JSON.stringify(o).split(/"@@([mp]:[a-z0-9]+)@@"/);let out=t[0];for(let i=1;i<t.length;i+=2)out+=big[t[i]]!==undefined?'"'+big[t[i]]+'"'+t[i+1]:'"@@'+t[i]+'@@"'+t[i+1];return out}
// nothing heavy is decoded here: images and PDFs stay as text until they are first shown
function unpack(o){const files=o.files||{};delete o.files;
 if(o.pdf&&!(o.pdfs&&o.pdfs.length))o.pdfs=[{name:o.manual||'Manual',offset:o.offset,map:o.map,data:o.pdf}];delete o.pdf;
 const P={};(o.pdfs||[]).forEach(p=>{p.id=p.id||uid();if(p.data){P[p.id]={data:p.data};delete p.data}});return{o:norm(o),files,P}}
async function dlCopy(){toast('Preparing copy…');const t=await pack(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=uniqueName(S.name,'-')+'.bcl';a.click();toast('Copy downloaded')}
// a shareable copy: same content, images and PDFs, but no profile stamp, no progress and no log, so it opens cleanly on any computer
// keepLog: the old entries stay readable, under a marked segment, so the checks can be re-entered from them
const blankCopy=keepLog=>o=>{delete o.stamp;delete o.ids;
 if(keepLog){o.seg=(o.seg||0)+1;(o.segs=o.segs||{})[o.seg]={kind:'recovery',label:'Exported as a fresh copy',note:'Entries above come from the original file',at:now()};o.log.push({at:now(),ev:'Exported as a fresh copy',item:'Entries above come from the original file',by:'',uid:'',seg:o.seg,flag:'recovery'})}
 else{delete o.segs;delete o.seg;o.log=[]}
 for(const s of o.sections)for(const c of s.cards)for(const x of [c,...c.steps]){x.done=false;x.init='';x.doneAt='';x.sig=null;x.sigDraft='';x.hist=[]}};
function exportDlg(){dlg(`<div class="dh"><b>Export for sharing</b></div><p>Saves a fresh copy with every section, step, image and PDF. Nothing is checked off, and sign-offs and the profile link are left out, so it opens on any computer or a new install. This checklist is not changed.</p><label class="chk"><input type="checkbox" id="exlog"> Include the activity log (read-only history, e.g. to re-enter checks after moving to a new install)</label><div class="dbtn"><button data-d="x">Cancel</button><button data-d="ok" class="pri">Export</button></div>`);
 DLGOK=()=>exportShare($('#exlog').checked)}
async function exportShare(keepLog){toast('Preparing export…');const t=await pack(null,blankCopy(keepLog)),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=uniqueName(S.name,'-')+' (shared).bcl';a.click();toast('Export downloaded')}

 try{const txt=await f.text(),raw=JSON.parse(txt);if(!raw.sections&&!raw.prep&&!raw.tasks)throw 0;const base=await FS.writeNew(f.name.replace(/\.[^.]+$/,''),txt);await refreshLib();openProject(base)}catch(x){toast('Not a valid checklist file')}};
let HS=null;

function renderHome(){const rec=LIB.filter(x=>x.opened).sort((a,b)=>b.opened-a.opened).slice(0,8);
 const row=(e,sub)=>`<div class="frow${HS===e.id?' sel':''}" data-id="${e.id}"><span class="fn">${esc(e.name)}</span>${sub?`<span class="mut">${esc(sub)}</span>`:''}${HS===e.id?'<button data-a="logv">LOG</button><button class="open" data-a="open">OPEN</button>':''}</div>`;

async function openHome(){if(CUR&&DIRTY)await flush();await refreshLib();PV=false;PU=false;EDITOK=null;$('#hcen').hidden=false;$('#hprof').hidden=true;$('#hProf').classList.remove('on');$('#home').hidden=false;renderHome()}

document.addEventListener('keydown',e=>{if(e.defaultPrevented||e.repeat||$('#home').hidden||!$('#modal').hidden||PV||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 if(e.key==='Enter'&&HS)openProject(HS);else if((e.key==='Delete'||e.key==='Backspace')&&HS)askDelete(HS);

// ---------- profile and PINs ----------
let PV=false,PU=false,TAMPER=null,CLT=null,PRX=null,EDITOK=null,FAILS=0,LOCKUNTIL=0;
const PR0=()=>({pid:'',user:'',salt:'',hash:'',rv:null,req:{names:false,sign:false,edit:false},people:[]});
let PR=PR0();
const errNow=()=>TAMPER||CLT;   // while an error is active the app is view-only: no checking, no sign-offs
const savePR=()=>(TAMPER||!PR.pid)?Promise.resolve():FS.profileSave(JSON.parse(JSON.stringify(PR))).catch(()=>{});
// The profile lives in Data/profile.json (signed) with a matching marker in the save folder; the main process checks both.
async function initProfile(){let r=await FS.integrity(),MIG=null;
 if(!r.body&&r.p==='none'&&r.m==='none'){   // one-time move of an older browser-storage profile into the signed file
  let old=null;try{old=JSON.parse(localStorage.getItem('ewf-profile'))}catch(e){}
  if(old&&(old.hash||old.pin)){old.people=Array.isArray(old.people)?old.people:[];
   if(old.pin){if(!old.hash){old.salt=await FS.newSalt();old.hash=await FS.hash(old.pin,old.salt)}delete old.pin}
   for(const p of old.people){if(!p.id)p.id=uid();if(p.pin){if(!p.hash){p.salt=await FS.newSalt();p.hash=await FS.hash(p.pin,p.salt)}delete p.pin}}
   const rec=await FS.recMake();old.pid=await FS.newPid();old.rv=rec.rv;
   try{if(await FS.profileSave(old)){localStorage.removeItem('ewf-profile');MIG=rec.code;r=await FS.integrity()}}catch(e){}}}
 PR=Object.assign(PR0(),r.body||{});PR.req=Object.assign({names:false,sign:false,edit:false},PR.req);if(!Array.isArray(PR.people))PR.people=[];
 PR.people.forEach(p=>{if(!p.id)p.id=uid()});
 TAMPER=r.code||null;PRX={body:r.body||null,profile:r.body?{pid:r.body.pid,rv:r.body.rv}:null,marker:r.marker||null};return MIG}
const pinOn=k=>!!(PR.hash&&PR.req[k]);
const isLocked=()=>!!S.locked||(pinOn('edit')&&!EDITOK)||!!errNow();
// who a PIN can belong to: the main profile always; the Names list only while "Assign PINs to names" is on
const roster=()=>[{id:'owner',uid:PR.pid,name:PR.user,boss:true,salt:PR.salt,hash:PR.hash},...(PR.req.names?PR.people.map(p=>({id:p.id,uid:p.id,name:p.name,boss:!!p.boss,salt:p.salt,hash:p.hash})):[])];
async function whoIs(pin){const l=roster(),id=await FS.matchPin(pin,l.map(x=>({id:x.id,salt:x.salt,hash:x.hash})));return id?l.find(x=>x.id===id)||null:null}
const pinTaken=async(pin,except)=>!!await FS.matchPin(pin,[{id:'owner',salt:PR.salt,hash:PR.hash},...PR.people].filter(x=>x.hash&&x.id!==except).map(x=>({id:x.id,salt:x.salt,hash:x.hash})));
// PIN pop-up: resolves with {name,boss,owner} or null. boss:true accepts only the main profile or a person marked Boss.
function askPin({title,note,boss}){return new Promise(res=>{
 const ov=document.createElement('div');ov.className='overlay';ov.style.zIndex=95;
 ov.innerHTML=`<div class="dlg" style="width:min(380px,92vw)"><div class="dh"><b>${esc(title)}</b></div>${note?`<p class="mut" style="margin:0 0 6px">${esc(note)}</p>`:''}<label>Enter your 4-digit PIN<input class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label><div class="warn" style="min-height:20px;margin-top:6px"></div><div class="dbtn"><button data-k="x">Cancel</button><button data-k="ok" class="pri">Accept</button></div></div>`;
 document.body.appendChild(ov);const inp=ov.querySelector('input'),err=ov.querySelector('.warn'),ok=ov.querySelector('[data-k=ok]');let busy=false,tm=0;
 const done=v=>{clearInterval(tm);ov.remove();res(v)};
 const wait=()=>{const w=Math.ceil((LOCKUNTIL-Date.now())/1000);if(w>0){err.textContent=`Too many wrong PINs. Wait ${w} s.`;inp.disabled=ok.disabled=true;return true}if(inp.disabled){inp.disabled=ok.disabled=false;err.textContent='';inp.focus()}return false};
 const submit=async()=>{if(busy||wait())return;const v=inp.value;if(!/^\d{4}$/.test(v)){err.textContent='Enter all 4 digits.';inp.select();return}
  busy=true;ok.disabled=true;let w=null;try{w=await whoIs(v)}catch(e){}busy=false;ok.disabled=false;
  if(w&&(!boss||w.boss)){FAILS=0;return done(w)}
  if(w){err.textContent='Only the main profile or a Boss can do this.';inp.value='';inp.focus();return}
  if(++FAILS>=5){FAILS=0;LOCKUNTIL=Date.now()+30000;inp.value='';wait();tm=setInterval(wait,500);return}
  err.textContent='Wrong PIN.';inp.value='';inp.focus()};
 ov.addEventListener('click',e=>{const k=e.target.dataset.k;if(k==='x'||e.target===ov)done(null);else if(k==='ok')submit()});
 ov.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();submit()}else if(e.key==='Escape'){e.stopPropagation();done(null)}});
 inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(0,4)});
 inp.focus();if(LOCKUNTIL>Date.now()){wait();tm=setInterval(wait,500)}})}
function updLock(){const b=$('#lockBtn');if(!b)return;const on=pinOn('edit')&&!!CUR;b.hidden=!on;if(!on)return;
 b.textContent=EDITOK?'🔓 Lock editing':'🔒 Unlock editing';b.classList.toggle('open',!!EDITOK);
 b.title=EDITOK?'Editing was unlocked by '+EDITOK.name+'. Click to lock it again.':'Editing is locked. A PIN from the main profile or a Boss is needed.'}
function refreshAll(){renderL();renderR();updLock()}
async function unlockEdit(){if(errNow()){showErr(errNow());return false}const w=await askPin({title:'Unlock editing',note:'Main profile or Boss PIN.',boss:true});if(!w)return false;EDITOK=w;logEv('editing unlocked',{text:S.name||''},w.name,w.uid);save();refreshAll();return true}
function lockEdit(){EDITOK=null;refreshAll()}
$('#lockBtn').onclick=()=>EDITOK?lockEdit():unlockEdit();

 if(TAMPER){p.innerHTML=`${back}<h2>Profile</h2><div class="warn" style="margin-bottom:10px">Error ${esc(TAMPER)} is active. Checking boxes and sign-offs are disabled.</div><p class="mut">Without the recovery code, the checklists can still be opened and taken out: open one, then Menu &gt; Export for sharing… gives a fresh copy (with its activity log if you tick the box) that works in a new install.</p>

function showLog(title,log,segs){document.querySelectorAll('.logov').forEach(x=>x.remove());segs=segs||{};log=log||[];
 const ov=document.createElement('div');ov.className='overlay logov';ov.style.zIndex=75;ov.tabIndex=-1;
 ov.innerHTML=`<div class="dlg" style="width:min(1000px,96vw);max-height:92vh;display:flex;flex-direction:column"><div class="dh"><b>Activity log: ${esc(title)}</b><button data-k="x">✕</button></div><div style="display:flex;gap:8px;margin-bottom:8px"><input id="lgq" placeholder="Filter by name, event or item…" style="flex:1"><button data-k="csv">Download CSV</button></div><div class="mut" id="lgn" style="margin-bottom:6px"></div><div id="lgb" style="overflow:auto;min-height:0;flex:1"></div></div>`;

  for(const l of log){const sg=l.seg||0,g=segs[sg]||{};
   if(sg!==cur){cur=sg;if(sg>0)rows+=`<tr class="lseg ${g.kind==='recovery'?'recovery':'tamper'}"><td colspan="5">${g.kind==='recovery'?'↻ Profile or checklist recovered. Entries below follow this event':'⚠ POSSIBLE TAMPERED. Everything below this line is separated from the earlier record'}<div style="font-weight:400;font-size:12px">${esc(g.label||'')}${g.note?' · '+esc(g.note):''} · ${esc(fmt(g.at||l.at))}</div></td></tr>`}

   n++;rows+=`<tr class="${sg>0?(g.kind==='recovery'?'rec':'tam'):''}"><td>${esc(fmt(l.at))}</td><td>${esc(l.by)}</td><td>${esc(l.ev)}</td><td>${esc(l.item)}</td><td class="mut" title="${esc(l.uid||'')}">${esc((l.uid||'').slice(0,6))}</td></tr>`}
